optimizer:
  method: "agentgeo,autogeo,baseline"

autogeo:
  dataset_name: "GEO-Bench"
  engine_llm: "gpt-4.1"
  rule_path: null
  config_path: "geo_agent/config_gpt4.1.yaml"

agentgeo:
  config_path: "geo_agent/config_gpt4.1.yaml"
  batch_size: 10
  max_concurrency: 5
  citation_method: "llm"
  citation_composite_strategy: "any"
  attr_evaluator_config: null
  use_fast_mode: true
  enable_memory: true
  enable_history: true
  chunks_per_orchestra: 2
  suggestion_merge_strategy: "diagnosis_aware"
  enable_autogeo_rephrase: true
  disk_cache_dir: "/Users/erv1n/autoGEO_reproduce/experiments/cache"
  optimization_log_dir: "outputs_gpt4.1_newdocs2/logs"

baseline:
  provider: "openai"
  model: "gpt-4.1"
  methods:
    - keyword_stuffing
    - easy_to_understand

data:
  input_type: "parquet"
  input_path: "data/input.parquet"
  doc_limit: 10
  doc_offset: 60
  required_fields:
    - raw_html
    - train_queries
    - test_queries

output:
  base_dir: "outputs_gpt4.1_newdocs2"
  save_optimized_html: true
  save_evaluation: true

evaluation:
  enable_citation: false
  enable_geo_score: false
  enable_similarity: false
