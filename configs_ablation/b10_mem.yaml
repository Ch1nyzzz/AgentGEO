optimizer:
  method: agentgeo
autogeo:
  dataset_name: GEO-Bench
  engine_llm: claude-haiku-4-5-20251001
  rule_path: null
agentgeo:
  config_path: geo_agent/config.yaml
  batch_size: 10
  max_concurrency: 5
  citation_method: llm
  citation_composite_strategy: any
  attr_evaluator_config: null
  use_fast_mode: true
  enable_memory: true
  enable_history: true
  chunks_per_orchestra: 2
  suggestion_merge_strategy: diagnosis_aware
  enable_autogeo_rephrase: true
  disk_cache_dir: /Users/erv1n/autoGEO_reproduce/experiments/cache
  optimization_log_dir: outputs/logs
baseline:
  provider: openai
  model: gpt-4.1-mini
  methods: null
data:
  input_type: parquet
  input_path: data/input.parquet
  doc_limit: 50
  doc_offset: 0
  required_fields:
  - raw_html
  - train_queries
  - test_queries
output:
  base_dir: outputs
  save_optimized_html: true
  save_evaluation: true
evaluation:
  enable_citation: true
  enable_geo_score: false
  enable_similarity: false
